name: Update Schedule and Content

on:
  pull_request:
    paths:
      - "schedule.json"
    branches:
      - main

env:
  # Several editions: id of the edition to import, e.g. "2026"
  EDITION: ""

jobs:
  build:
    name: Update Schedule and Content
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          lfs: true

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r _tools/requirements.txt

      - name: Parse schedule and generate files
        run: |
          sudo locale-gen de_CH.UTF-8
          source .venv/bin/activate
          python _tools/import_schedule.py --lc-time de_CH.UTF-8 ${EDITION:+--edition "$EDITION"} schedule.json

      # With an edition, the program and the edition's pages, e.g.
      # _data/programs/2026.yml and 2026/program/index.md
      - name: Delete source and add generated files
        run: |
          git rm schedule.json
          if [ -n "$EDITION" ]; then
            git add --ignore-errors "_data/programs/$EDITION.yml" "$EDITION" _rooms _speakers _talks
          else
            git add --ignore-errors _data/program.yml _rooms _speakers _talks
          fi

      - name: Add new commit and push
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Generate schedule and content from source"
          git push

      - name: Add comment to PR
        env:
          URL: ${{ github.event.pull_request.comments_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl \
            -X POST \
            $URL \
            -H "Content-Type: application/json" \
            -H "Authorization: token $GITHUB_TOKEN" \
            --data '{ "body": "Schedule and content files have successfully been generated and added!\n\nBe sure to select _squash and merge_ for this pull request if you want to avoid that the original file `schedule.json` becomes a part of the repository." }'
