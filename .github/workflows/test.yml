name: Test

# Builds the fixture site (test/fixture) with the theme and checks the
# generated output, the JavaScript in a browser and the import scripts
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build JavaScript and CSS bundles
        run: npm run build

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: test/fixture

      - name: Test generated site
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test in browser
        run: npm run test:e2e
        env:
          SKIP_BUILD: "1"

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Test import scripts
        run: uv run --no-project --with-requirements _tools/requirements.txt python -m unittest discover test/tools
