# Test site with two editions: 2026 (current, first in the list) and 2025
# (archive), sharing speaker and room names

title: Edition Conference
description: A conference held every year
baseurl: /conf
url: https://example.org
timezone: Europe/Zurich
theme: jekyll-theme-conference

exclude:
  - Gemfile
  - Gemfile.lock

collections:
  talks:
    output: true
  speakers:
    output: true
  rooms:
    output: true

defaults:
  - scope:
      type: talks
    values:
      layout: talk
  - scope:
      type: speakers
    values:
      layout: speaker
  - scope:
      type: rooms
    values:
      layout: room
  - scope:
      path: "2026"
    values:
      edition: "2026"
  - scope:
      path: "_*/2026"
    values:
      edition: "2026"
      permalink: /2026/:collection/:title/
  - scope:
      path: "2025"
    values:
      edition: "2025"
  - scope:
      path: "_*/2025"
    values:
      edition: "2025"
      permalink: /2025/:collection/:title/

conference:
  lang: en
  show_errors: true

  live:
    streaming:
      enable: true

  pwa:
    enable: true

  navigation:
    logo:
      name: Edition Logo
      img: logo.png
      url: https://example.org
    links:
      - name: Program
        relative_url: /program/
      - name: Talks
        relative_url: /talks/
      - name: Speakers
        relative_url: /speakers/
      - live: true

  talks:
    tracks:
      - name: Main
        color: info

  editions:
    - id: "2026"
      title: Edition Conference 2026
    - id: 2025
      name: Archive 2025
      title: Edition Conference 2025
      talks:
        tracks:
          - name: Classic
            color: warning
      navigation:
        editions:
          name: Years
        links:
          - menu: editions
          - name: Archived Program
            relative_url: /program/
