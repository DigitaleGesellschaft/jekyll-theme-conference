{%- assign live_lang = site.data.lang[site.conference.lang].live -%}
<div class="modal fade" id="stream-modal" tabindex="-1" aria-labelledby="stream-modal-title" aria-describedby="stream-modal-desc" aria-hidden="true" role="dialog">
  <div class="modal-dialog modal-lg modal-fullscreen-sm-down">
    <div class="modal-content">

      <div class="modal-header">
        <h2 class="modal-title h5" id="stream-modal-title">
          {{ live_lang.stream | default: "Live Stream" }}
        </h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{{ site.data.lang[site.conference.lang].close | default: 'Close' }}"></button>
      </div>

      {%- include show_stream.html class_body="modal-body" class_footer="modal-footer" %}

      <div class="modal-footer d-sm-none">
        <button type="button" class="btn btn-secondary w-100" data-bs-dismiss="modal">{{ site.data.lang[site.conference.lang].close | default: 'Close' }}</button>
      </div>

    </div>
  </div>
</div>
