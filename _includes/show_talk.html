{%- if talk.hide -%}
  <span {% if talk.lang %}lang="{{ talk.lang | escape }}" {% endif %}class="talk-title">{{ talk.name | escape }}</span>
{%- else -%}
  <a {% if talk.lang %}lang="{{ talk.lang | escape }}" {% endif %}class="talk-title text-reset link-underline-{{ track_color }} link-underline-opacity-0 link-underline-opacity-100-hover" href="{{ talk.url | prepend: site.baseurl }}">{{ talk.name | escape }}</a>
{%- endif -%}
