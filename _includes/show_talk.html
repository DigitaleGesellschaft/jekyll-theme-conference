{%- if talk.hide -%}
  {%- if talk.lang -%}<span lang="{{ talk.lang | escape }}">{{ talk.name | escape }}</span>{%- else -%}{{ talk.name | escape }}{%- endif -%}
{%- else -%}
  <a {% if talk.lang %}lang="{{ talk.lang | escape }}" {% endif %}class="text-reset link-underline-{{ track_color }} link-underline-opacity-0 link-underline-opacity-100-hover" href="{{ talk.url | prepend: site.baseurl }}">{{ talk.name | escape }}</a>
{%- endif -%}
